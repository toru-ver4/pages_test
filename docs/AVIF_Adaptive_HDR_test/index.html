  <style>
    /* Reset & 全画面幅テーブル固定レイアウト */
    body {
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
      background-color: #f5f5f5;
    }
    table {
      width: 100%;
      table-layout: fixed;      /* <colgroup> による列幅指定を優先 */
      border-collapse: collapse; /* セル隙間をなくす */
    }
    th, td {
      padding: 0;
      border: none;
      margin: 0;
    }
    th {
      background-color: #dddddd;
      text-align: center;
      font-weight: bold;
      padding: 8px 0;
      font-size: 1rem;
    }

    /* <colgroup> による列幅指定 */
    colgroup col:first-child {
      width: 5%;   /* Param 列を全体幅の 5% に固定 */
    }
    colgroup col:nth-child(2),
    colgroup col:nth-child(3),
    colgroup col:nth-child(4) {
      width: 31.6667%; /* 残り 95% を 3 等分 */
    }

    /* ↓ 変更箇所：Paramセルを中央寄せに強制適用 ↓ */
    table td.param-cell {
      text-align: center !important;  /* 水平中央揃えを最優先で適用 */
      vertical-align: middle !important;/* 縦方向の中央揃え（必要であれば） */
      background-color: #ffffff;
      font-size: 0.9rem;
      font-weight: bold;
      padding: 8px 0;
      box-sizing: border-box;
    }

    /* 画像セルまわり。余白も適宜付与 */
    td.img-cell {
      position: relative;
      box-sizing: border-box;
      padding: 4px;    /* 画像周囲の余白を確保 */
    }
    td.img-cell img {
      display: block;
      width: 100%;
      height: auto;
      cursor: pointer;
      box-sizing: border-box;
    }

    /* モーダル（dialog）関係（変更なし） */
    dialog {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.8);
      padding: 0;
      border: none;
      margin: 0;
      z-index: 1000;
    }
    dialog:target {
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .dialog-backdrop {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      text-decoration: none;
    }
    dialog img {
      max-width: 90vw;
      max-height: 90vh;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.979);
      z-index: 2;
    }
    .close-btn {
      position: absolute;
      top: 16px;
      right: 16px;
      text-decoration: none;
      font-size: 2rem;
      color: #ffffff;
      background: transparent;
      z-index: 3;
    }
    .close-btn:hover {
      color: #ffdddd;
    }

    /* レスポンシブ調整（600px以下） */
    @media screen and (max-width: 600px) {
      table, tr, th, td {
        display: block;
        width: 100%;
      }
      tr {
        margin-bottom: 16px;
        border-bottom: 1px solid #cccccc;
      }
      th {
        display: none;
      }
      td.param-cell {
        background-color: #dddddd;
      }
      td.img-cell {
        width: 100%;
        margin-top: 8px;
        box-sizing: border-box;
        padding: 4px;
      }
    }
  </style>
