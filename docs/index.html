    <h3>Utility</h3>
    <a href="./show_ua_hdr_capabilities/index.html">Show Browser HDR Support Info</a><br>
    <button type="button" id="download-browser-hdr-info">
        Download Browser HDR Support Info
    </button>

    <script src="./js/browser_hdr_capabilities.js"></script>
    <script>
        document
            .getElementById("download-browser-hdr-info")
            .addEventListener("click", () => {
                const script = document.createElement("script");
                script.src = `./js/dump_browser_info.js?t=${Date.now()}`;
                script.async = true;
                document.body.appendChild(script);
                script.addEventListener("load", () => script.remove(), { once: true });
                script.addEventListener("error", () => {
                    script.remove();
                    console.error("Failed to load ./js/dump_browser_info.js");
                }, { once: true });
            });
    </script>
